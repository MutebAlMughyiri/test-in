# Every push and every pull request is compiled, tested and put through the
# Plugin Verifier, so a red state is found by a robot rather than by whoever
# pulls next. Work moves between machines here, and until now the only evidence
# a commit worked was a build on whichever machine happened to write it.
#
# Deliberately not here, with a reason and not a matter of effort: the IDE
# inspection gate. tools/inspect.ps1 costs a full indexing pass, so it runs in
# its own workflow, inspect.yml, on every push rather than inside this build.
#
# Not here either: Qodana. Its Cloud license was not renewed in October 2026,
# so it runs on a developer's machine when asked, with the free Community
# linter. CONTRIBUTING.md has the command.
#
# Coverage is here (#325). JaCoCo measures test and ideTest together across the
# three modules, the report is kept below, and jacocoTestCoverageVerification
# fails the build under the minimum build.gradle.kts sets.
#
# It measured nothing the first time (#130): 0% of 577 classes while 492 tests
# passed. The platform test framework loads the plugin through
# com.intellij.util.lang.PathClassLoader, which gives a class no code location,
# and the agent skips such a class unless isIncludeNoLocationClasses is on - the
# one setting the IntelliJ Platform Gradle Plugin's FAQ names for this. With it,
# ideTest alone takes the indexer from 4% to 58%.
#
# The report reads the instrumentCode output, never build/classes. JaCoCo
# matches a class by a checksum of its bytes, and the uninstrumented classes are
# not the ones the tests loaded. Pointed there, every class the instrumenter
# rewrote reads as never run. The build would then stay green over a wrong figure.
name: Build

on:
  push:
    # main only. A branch is built through its pull request, and listening for
    # both here ran every Dependabot branch twice - once for the push that
    # created it and once for the pull request that followed, thirteen minutes
    # apiece. No tags either: a tag is release.yml's.
    branches: [ main ]
  pull_request:

# A second push to the same branch makes the first run's answer worthless, so it
# is canceled rather than left to finish. Never cancels a run on main.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Build, test and verify
    # Windows because that is where this suite is known to pass. Three tests in
    # the dialog framework build a real Swing text field. It asks the toolkit for
    # the menu shortcut mask and throws HeadlessException where there is no
    # display. So a Linux runner needs xvfb or a change in production code, and
    # neither belongs in the commit that first turns CI on. It also matches the
    # machines the plugin is developed on. The repository is public, so the
    # minutes cost nothing.
    runs-on: windows-latest
    # 90, as Inspect has. A run that finds no cache resolves the six IDEs
    # verifyPlugin reads before the first task (21 minutes on 1f318abeb) and
    # saves the Gradle cache after the last (over 18). That run passed every
    # gate by minute 40 and was canceled at 60 while saving.
    timeout-minutes: 90

    steps:
      - name: Check out the commit
        uses: actions/checkout@v7

      - name: Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Caches ~/.gradle without its downloads. On a79ccf0c5 the downloaded
      # dependencies came to 11.3 GB and their transforms to 10.3 GB, almost
      # all of it the six IDEs verifyPlugin reads. Either one is more than the
      # repository's 10 GB, so each save pushed out every other entry, and
      # saving them took 22 of the run's 49 minutes (#430). Every run downloads
      # its dependencies, as it already did, since nothing was left to restore.
      # The wrapper, the build cache and the script caches are what stays.
      - name: Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-excludes: |
            caches/modules-2
            caches/*/transforms

      # The verifier downloads the IDE it runs against. It changes only when
      # build.gradle.kts or gradle.properties names a different version, so the
      # key is those files rather than the commit. Every run reads it, and only
      # main saves it (see the save step below).
      - name: Restore the IDE the verifier runs against
        id: verifier-ide
        uses: actions/cache/restore@v6
        with:
          path: ~/.pluginVerifier
          key: plugin-verifier-${{ hashFiles('build.gradle.kts', 'gradle.properties') }}
          restore-keys: plugin-verifier-

      # Windows Defender scans every file the tests write and holds it open
      # while it does. A test's temp folder can still be in use when the test
      # framework deletes it, and every write waits. On 6 and 7 October 2026
      # three runs failed this way, a different test each time and never on
      # a developer's machine: the test run writer still busy after 10 s, a
      # temp folder "used by another process", and an indexing race. The
      # checkout, the temp folder and the Gradle cache are left out of the
      # real-time scan; nothing in them comes from outside the repository.
      - name: Leave the build out of Defender's real-time scan
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}", "$env:TEMP", "$env:USERPROFILE\.gradle"

      # One invocation that runs every gate, failing at the end if any failed.
      # The reports below are uploaded either way.
      #
      # verifyPlugin here means IntelliJ IDEA, PyCharm and Rider, each at the
      # build this compiles against and the oldest it claims - build.gradle.kts
      # records why. verify.yml verifies every product the Marketplace lists.
      #
      # ideTest runs the tests that need a running IDE: the indexer, the tree,
      # an undo across two test sets, filing a bug. The unit tests cannot reach
      # any of them, and until this line they ran only on a developer's machine.
      - name: Build, test and verify
        shell: bash
        # The budget second and alone, so the clock it reads is not shared with
        # compiling and verifying (#66, finding 108). --continue so one gate's
        # failure never hides the others': pmdMain failing stopped this step
        # before ideTest on three pushes in a row (#66, finding 388).
        run: |
          ./gradlew compileJava test pmdMain ideTest ruleTrace jacocoTestCoverageVerification verifyPlugin verifyDistribution --continue
          ./gradlew test -Pbudget

      # A failed test names itself on the run page, the way Inspect lists its
      # findings, so the failure email's link shows the cause (#439).
      - name: List the failed tests on the run page
        if: failure()
        shell: pwsh
        run: |
          $failed = @(Get-ChildItem -Path build/test-results, */build/test-results -Recurse -Filter *.xml -ErrorAction SilentlyContinue |
              ForEach-Object { ([xml](Get-Content -Raw $_.FullName)).SelectNodes('//testcase[failure or error]') } |
              ForEach-Object { '- `{0}` {1}: {2}' -f $_.GetAttribute('classname'), $_.GetAttribute('name'), ($_.SelectSingleNode('failure|error').GetAttribute('message') -split "`n")[0] })
          if ($failed.Count -gt 0) { (@("**$($failed.Count) failed test(s):**", '') + $failed) | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 }

      # Only main saves the verifier's IDE. Four Dependabot pull requests each
      # saved a 3 GB copy under their own ref on 26 October 2026, which no other
      # ref can restore, and together they pushed main's entries out (#430).
      - name: Save the IDE the verifier runs against
        if: github.ref == 'refs/heads/main' && steps.verifier-ide.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.pluginVerifier
          key: ${{ steps.verifier-ide.outputs.cache-primary-key }}

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          if-no-files-found: ignore
          path: |
            build/reports/tests/test
            build/reports/tests/ideTest*
            build/reports/rule-coverage
            build/reports/rule-trace
            build/reports/jacoco/test
            build/reports/pluginVerifier
