# The Plugin Verifier against every product the JetBrains Marketplace names as
# compatible with the plugin, on every push to main.
#
# build.yml verifies against IntelliJ IDEA, PyCharm and Rider. This verifies
# every product the plugin page lists, so it is what the Marketplace will say
# about the plugin when it is published. The Marketplace runs this same
# verifier and shows its findings on the plugin page, so the answer here is the
# answer a tester sees before installing.
#
# One job per product, side by side, each downloading only its own IDE: fifteen
# products at two versions in one job took hours and more disk than a runner
# has. A product shows red or green on its own.
#
# Every target reports zero problems, so any problem on any of them fails the
# run. It was compared against a baseline of known problems until they reached
# zero on 7 October 2026.
name: Verify

on:
  # Every push to main, so the Marketplace's answer is known for the commit that
  # changed it rather than up to two days later. It was on the schedule alone
  # until 2026-09-20, and that is how a deprecated call reached main and stayed
  # there: build.yml caught it because it gates on IntelliJ IDEA, but the count
  # a tester reads on the plugin page is this one, and nothing was asking for it.
  push:
    branches: [ main ]

  # Kept as well as the push. A platform release can change this answer with no
  # commit of ours behind it - a method deprecated in the next IDE is a warning
  # that appears on a quiet week - and only a clock finds that.
  schedule:
    # 03:00 UTC on every odd day - an hour after Inspect, so the two never
    # compete for a runner or for the same Gradle cache entry.
    - cron: '0 3 */2 * *'

  workflow_dispatch:

# A second push to main makes the first run's answer worthless, so it is
# canceled rather than left to finish. Named per workflow and branch, so it
# never cancels the scheduled run or a run of build.yml.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify against ${{ matrix.ide }}
    runs-on: windows-latest
    timeout-minutes: 60

    # The one list of the products verified and their versions. A product with
    # no versions is verified at the first release of the branch sinceBuild
    # names and at the build this compiles against (build.gradle.kts). A
    # product with no release on that branch carries the reason instead, and
    # its job says so on the run page rather than failing or passing.
    #
    # JetBrains Gateway and JetBrains Client, Code With Me's guest among them,
    # are not here: plugin.xml leaves both out, the Client by name and Gateway
    # by requiring the language support it lacks, so the Marketplace does not
    # offer Testin there (#419). Android Studio has one release on 262.
    strategy:
      fail-fast: false
      matrix:
        include:
          - ide: IntellijIdea
          - ide: AndroidStudio
            versions: 2026.2.1.8
          - ide: CLion
          - ide: DataGrip
          - ide: DataSpell
            unreleased: DataSpell has no release on build 262 yet (its newest is 2026.1.3), so Testin cannot be installed in it
          - ide: GoLand
          - ide: MPS
            unreleased: MPS has only a 2026.2 EAP on build 262, so no release of it can install Testin yet
          - ide: PhpStorm
          - ide: PyCharm
          - ide: Rider
          - ide: RubyMine
          - ide: RustRover
          - ide: WebStorm

    steps:
      - name: Say why it is not verified
        if: matrix.unreleased
        shell: bash
        run: echo "::notice title=${{ matrix.ide }} not verified::${{ matrix.unreleased }}"

      - name: Check out the commit
        if: ${{ !matrix.unreleased }}
        uses: actions/checkout@v7

      - name: Java 25
        if: ${{ !matrix.unreleased }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Gradle
        if: ${{ !matrix.unreleased }}
        uses: gradle/actions/setup-gradle@v6

      # No cache for the IDEs: fifteen products at about 3 GB each is far past
      # the repository's 10 GB, and filling it would push out the Gradle cache
      # build.yml lives on. Each job downloads its own from JetBrains.
      - name: Verify
        if: ${{ !matrix.unreleased }}
        shell: bash
        run: ./gradlew verifyPlugin -PverifyIde=${{ matrix.ide }} ${{ matrix.versions && format('-PverifyVersions={0}', matrix.versions) || '' }}

      - name: Keep the verification report
        if: ${{ always() && !matrix.unreleased }}
        uses: actions/upload-artifact@v7
        with:
          name: verification-${{ matrix.ide }}
          if-no-files-found: ignore
          path: build/reports/pluginVerifier
