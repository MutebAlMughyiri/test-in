####################################################################################################################
# WARNING: Do not store sensitive information in this file, as its contents will be included in the Qodana report. #
####################################################################################################################

version: "1.0"
linter: qodana-jvm

# The project's own profile, the one the IDE selects through
# .idea/inspectionProfiles/profiles_settings.xml and the one tools/inspect.ps1
# hands the headless inspector. Qodana reads an IntelliJ XML profile from a path
# as readily as it reads one of its own by name, so the three now ask the same
# question of the same rules.
#
# It was qodana.recommended until then, and that profile turns on inspections
# this project has switched off on purpose. The first cloud report was 91
# findings, 86 of them OptionalUsedAsFieldOrParameterType. A field holding an
# Optional is how a Testin field says "not set yet", so the profile below
# disables that inspection. CLAUDE.md says turning it back on means reversing
# the decision rather than tidying up. A gate that reports 86 things nobody
# will ever change is a gate nobody reads.
#
# UnusedProperty is off for the same reason, and the evidence is stronger. It
# reported 176 findings over 60 keys, and every one of the 60 is an action.,
# group. or toolwindow. key. The platform composes those at runtime from a
# plugin.xml id, so no Bundle.message call names them and no inspection can see
# them read. BundleKeysTest already owns the question.
# everyKeyInTheBundleIsAskedForSomewhere fails on an unreferenced key and skips
# exactly those three prefixes; everyDeclaredActionIsNamedInTheBundle fails when
# a declared action has no action.<id>.text key at all. So the inspection was
# reporting as dead the keys a test demands exist.
#
# SplitModeApiUsage, SplitModeXmlApiUsage and UseOptimizedEelFunctions are off
# too, decided 1 October 2026. They ran once the Gradle import was whole and
# reported 66 of the 121 findings on 51f5a9e1. Split Mode asks for the plugin to
# be cut into frontend and backend modules so it can run under JetBrains remote
# development; Testin runs in one IDE process and remote development is not a
# target, so an issue for it brings these back if it ever is. Eel asks file
# reads and writes to go through the remote-environment Eel API, and that API is
# mostly @ApiStatus.Internal or Experimental - the verifier gate in
# build.gradle.kts fails on both, so following the advice would break the build.
profile:
  path: .idea/inspectionProfiles/Testin.xml

# Inspections Qodana runs beyond the profile. They are Qodana's alone, so the
# IDE and tools/inspect.ps1 are unchanged: the license audit of every
# dependency, a dependency with a known vulnerability, copy-pasted code (one
# owner for every fact, no second copy), and the test coverage the build hands
# over in .qodana/code-coverage.
include:
  - name: CheckDependencyLicenses
  - name: VulnerableLibrariesLocal
  - name: DuplicatedCode
  - name: JvmCoverageInspection

# The gate: any finding Qodana reports fails the run, the same zero the
# inspection gate holds. A finding is fixed, or excused below with its reason.
#
# Info is the one level left out, because the coverage inspection reports at
# it: it lists every method no test reaches, which is how the report shows
# coverage, not a defect - 680 of them failed the first run with a zero for
# every level. The coverage minimum is the build's own JaCoCo gate. Grammar
# also reports at Info, and tools/inspect.ps1 fails on it.
failureConditions:
  severityThresholds:
    critical: 0
    high: 0
    moderate: 0
    low: 0

# Testin is Apache-2.0. A dependency under a copyleft license would bind the
# plugin to its terms, so those are refused outright; everything else follows
# Qodana's own compatibility table for Apache-2.0.
licenseRules:
  - keys:
      - "Apache-2.0"
    prohibited:
      - "GPL-2.0-only"
      - "GPL-2.0-or-later"
      - "GPL-3.0-only"
      - "GPL-3.0-or-later"
      - "AGPL-3.0-only"
      - "AGPL-3.0-or-later"
      - "SSPL-1.0"

# The one list of exceptions. Qodana reads it here, and tools/inspect.ps1 reads
# the same entries, so the CI report and the inspection gate cannot disagree
# about what is excused. Every entry names the narrowest path it can, and says
# why nothing better is possible. Anything not listed fails the gate.
exclude:
  # Files whose bytes something else owns. gradlew and gradlew.bat are written
  # by Gradle's wrapper task. EULA.md and PRIVACY_POLICY.md are JetBrains'
  # agreements quoted verbatim.
  - name: All
    paths:
      - gradlew
      - gradlew.bat
      - EULA.md
      - PRIVACY_POLICY.md

  # The documentation site's stylesheet is a Jekyll file. It opens with the
  # --- front matter Jekyll needs, read as a selector missing its comma; it
  # imports {{ site.theme }} and palette from Jekyll's _sass folder, neither a
  # path the inspector can follow; and it styles the classes the theme's own
  # layout writes, which is not in this repository. Every other inspection
  # reads the file.
  - name: CssInvalidHtmlTagReference
    paths:
      - docs/assets/css/style.scss

  - name: CssMissingComma
    paths:
      - docs/assets/css/style.scss

  - name: CssUnknownTarget
    paths:
      - docs/assets/css/style.scss

  - name: CssUnusedSymbol
    paths:
      - docs/assets/css/style.scss

  # The documentation site loads Mermaid from its CDN, which is how a static
  # page gets it. The inspector keeps no local copy of a library behind a URL,
  # so it reports the link. A local copy would need Jekyll's relative_url path,
  # which the inspector cannot resolve either. The mermaid global the library
  # defines is declared in the file with /* global mermaid */, so every other
  # inspection reads the file, unresolved references included.
  - name: JSUnresolvedLibraryURL
    paths:
      - docs/_includes/head-custom.html

  # An action's inputs are declared in its action.yml online, which an offline
  # inspector cannot fetch, so every with: key reads as undefined.
  - name: UndefinedParamsPresent
    paths:
      - .github/workflows

  # The same lookup for the action itself: it asks GitHub's API without signing
  # in, and on a shared CI runner the anonymous rate limit runs out, so all 15
  # uses: lines came back unresolved on 7 October 2026 with nothing wrong in
  # them. Dependabot keeps the action versions real.
  - name: UndefinedAction
    paths:
      - .github/workflows
